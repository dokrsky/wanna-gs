name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      QUALITY_PR_BASE: ${{ github.event.pull_request.base.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # DATA02 verifies the actually published old SQLite source.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run offline suites and production build
        id: checks
        run: npm run check:offline
      - name: Aggregate gate (including failed or missing execution)
        if: always()
        env:
          QUALITY_REPORT: ${{ steps.checks.outputs.report }}
        run: |
          test -n "$QUALITY_REPORT"
          npm run check:evidence -- "$QUALITY_REPORT"
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/quality/
          if-no-files-found: error
          retention-days: 14
